apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dil-connector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Data-Space-Lab/DIL-Connector-deployment.git
    targetRevision: HEAD
    path: .
    helm:
      # Keep credentials out of Git. Trusted Argo administrators can enable
      # registry.pullSecret.create and provide the username/password as
      # protected Application parameters when needed.
      parameters:
        - name: registry.pullSecret.create
          value: "false"
        - name: registry.pullSecret.name
          value: ghcr-pull-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: dil-connector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
