apiVersion: apps/v1
kind: Deployment
metadata:
  name: dil-connector-dataplane
  namespace: dil-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dil-connector-dataplane
  template:
    metadata:
      labels:
        app: dil-connector-dataplane
    spec:
      serviceAccountName: dil-connector
      containers:
        - name: dil-connector-dataplane
          image: ghcr.io/data-space-lab/dil-connector-dataplane:latest
          imagePullPolicy: Always
          command:
            - uvicorn
            - dataplane.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8284"
          env:
            - name: DATAPLANE_RCLONE_ENABLED
              value: "false"
            - name: DATAPLANE_OPCUA_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8284
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
