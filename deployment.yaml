apiVersion: apps/v1
kind: Deployment
metadata:
  name: dil-connector
  namespace: dil-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dil-connector
  template:
    metadata:
      labels:
        app: dil-connector
    spec:
      serviceAccountName: dil-connector
      containers:
        - name: dil-connector
          image: ghcr.io/data-space-lab/dil.-connector:latest
          imagePullPolicy: Always
          env:
            - name: CONNECTOR_SETTINGS_PATH
              value: /app/settings/kubernetes.json
          ports:
            - name: http
              containerPort: 8282
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/settings/kubernetes.json
              subPath: kubernetes.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: dil-connector-config
