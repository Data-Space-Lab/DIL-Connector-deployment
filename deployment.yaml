apiVersion: apps/v1
kind: Deployment
metadata:
  name: dil-connector
  namespace: dil-connector
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dil-connector
  template:
    metadata:
      labels:
        app: dil-connector
    spec:
      serviceAccountName: dil-connector
      containers:
        - name: dil-connector
          image: ghcr.io/data-space-lab/dil-connector:agreement-type-20260911
          imagePullPolicy: Always
          env:
            - name: CONNECTOR_SETTINGS_PATH
              value: /app/settings/kubernetes.json
            - name: DCP_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: dil-connector-dcp-key
                  key: private-key.pem
                  optional: true
            - name: DCP_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dil-connector-dcp-key
                  key: key-id
                  optional: true
          ports:
            - name: http
              containerPort: 8282
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/settings/kubernetes.json
              subPath: kubernetes.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: config
          configMap:
            name: dil-connector-config
