{{- define "dil-connector.key-bootstrap-annotations" }}
annotations:
  argocd.argoproj.io/hook: Sync
  argocd.argoproj.io/sync-wave: "-1"
  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  helm.sh/hook: pre-install,pre-upgrade
  helm.sh/hook-weight: "-10"
  helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
{{- if and .Values.dcp.enabled .Values.dcp.keySecret.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dil-connector-key-bootstrap
  namespace: {{ .Values.namespace | quote }}
  {{- include "dil-connector.key-bootstrap-annotations" . | nindent 2 }}
{{- if .Values.registry.pullSecret.create }}
imagePullSecrets:
  - name: {{ .Values.registry.pullSecret.name | quote }}
{{- else if .Values.imagePullSecrets }}
imagePullSecrets:
{{- range .Values.imagePullSecrets }}
  - name: {{ . | quote }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dil-connector-key-bootstrap
  namespace: {{ .Values.namespace | quote }}
  {{- include "dil-connector.key-bootstrap-annotations" . | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.dcp.keySecret.name | quote }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dil-connector-key-bootstrap
  namespace: {{ .Values.namespace | quote }}
  {{- include "dil-connector.key-bootstrap-annotations" . | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: dil-connector-key-bootstrap
    namespace: {{ .Values.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dil-connector-key-bootstrap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dil-connector-key-bootstrap
  namespace: {{ .Values.namespace | quote }}
  {{- include "dil-connector.key-bootstrap-annotations" . | nindent 2 }}
data:
  bootstrap_dcp_keys.py: |
{{ .Files.Get "scripts/bootstrap_dcp_keys.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dil-connector-key-bootstrap
  namespace: {{ .Values.namespace | quote }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: dil-connector-key-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: create-signing-secret
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: [python, /bootstrap/bootstrap_dcp_keys.py]
          env:
            - name: DCP_SECRET_NAME
              value: {{ .Values.dcp.keySecret.name | quote }}
            - name: DCP_KEY_ALGORITHMS
              value: {{ toJson .Values.dcp.keyAlgorithms | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: bootstrap-script
          configMap:
            name: dil-connector-key-bootstrap
{{- end }}
