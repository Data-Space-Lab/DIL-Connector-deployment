namespace: dil-connector

image:
  repository: ghcr.io/data-space-lab/dil-connector
  tag: dcp-http-pull-edr-20261007-1
  pullPolicy: Always

imagePullSecrets:
  - ghcr-pull-secret

connector:
  replicas: 1
  connectorId: DIL_CONNECTOR
  publicHost: dil-connector.example.org
  publicBaseUrl: https://dil-connector.example.org
  dspBasePath: /api/dsp
  outboundContractContext: https://w3id.org/dspace/2025/1/context.jsonld
  outboundContractNamespace: https://w3id.org/dspace/2025/1/
  auth:
    provider: json-header-any
    staticBearerToken: ""
  callbackHostOverride: ""
  didResolutionOverrideBaseUrl: ""

# Optional provider-side source addresses keyed by the requested DSP transfer
# profile. Use a native EDC address (type/endpoint plus S3 properties); the
# connector converts it to the DSP DataAddress representation on TransferStart.
dsp:
  providerFlows: {}
  providerDataAddresses: {}

contract:
  # Optional per-dataset overrides. A valid provider request sends an offer
  # automatically when no INITIAL_REQUEST/REQUESTED override is configured.
  # The GUI can change this live through /mgmt/connector-config.
  autoAcceptIncomingContractRequests: false
  providerFlows: {}

dataPlane:
  # Provision externally; missing keys leave Grafana authorization disabled.
  authorizationSecret: dil-connector-dataplane-auth
  # Internal service URL used by the connector to prepare provider addresses.
  baseUrl: http://dil-connector-dataplane:8284
  timeoutSeconds: 10
  # Private MediaMTX RTSP listener used by the RTSP adapter's H.264/AAC
  # normalization relay. This is never advertised to remote participants.
  rtspPrivateBaseUrl: rtsp://dil-connector-mediamtx-rtsp:8554
  rtspTranscodeH264: true
  rtspTranscodeMaxHeight: 1080
  # Zero keeps RTSP relay sessions alive until the transfer is explicitly
  # cancelled. Set a positive number to opt into automatic expiry.
  rtspSessionTtlSeconds: 0
  # Make the deployment value authoritative over stale persisted adapter
  # settings and reconcile /data/dataplane-config.json on startup.
  rtspSessionTtlEnforce: true
  # All HTTP-pull sources use the connector's public DSP URL as a short-lived
  # provider relay. This is derived automatically in the dataplane Deployment
  # from connector.publicBaseUrl and connector.dspBasePath.

catalog:
  participantId: ""
  serviceEndpointUrl: ""
  dataServiceType: dspace:connector
  requestTimeoutSeconds: 20
  # Production connectors must not load the TCK catalog fixture.
  seedFile: ""
  seedDatasetIds: []

# Company identity is sent only in payment-enabled contract requests. Keep
# legal/tax data tenant-specific and do not put payment-provider secrets in Git.
company:
  legalName: ""
  vatId: ""
  countryCode: ""
  address: ""
  email: ""
  website: ""

payment:
  enabled: false
  defaultProvider: manual
  webhookBaseUrl: ""
  receiptTtlSeconds: 86400
  viesUrl: https://ec.europa.eu/taxation_customs/vies/services/checkVatService
  viesTimeoutSeconds: 10
  viesCacheTtlSeconds: 86400
  vatRates: {}
  # Configure provider-specific credentials through a protected values source.
  adapters: {}
  allowTestAdapter: false

dcp:
  didResolutionTimeoutSeconds: 10
  didDocumentCacheTtlSeconds: 0
  didResolutionRetryAttempts: 1
  presentationQueryTimeoutSeconds: 20
  enabled: true
  resetCredentialsOnStartup: false
  seedMembershipCredential: true
  credentialTtlSeconds: 600
  credentialRefreshLeewaySeconds: 60
  holderDid: ""
  issuerDid: ""
  verifierDid: ""
  thirdPartyDid: ""
  credentialServiceEndpoint: ""
  issuerServiceEndpoint: ""
  verifierTriggerEndpoint: ""
  tokenValidationMode: did-jwt
  keyAlgorithms:
    - ES256
    - EdDSA
  signingAlgorithm: ES256
  keycloak:
    introspectionUrl: ""
    clientId: ""
    clientSecret: ""
    verifyTls: true

database:
  host: dil-connector-postgres
  port: 5432
  name: connector
  username: connector
  password: connector
  echo: false
  storage: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi

postgres:
  image: postgres:16
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

management:
  enabled: true
  replicas: 1
  port: 8283

dataplane:
  enabled: true
  image:
    repository: ghcr.io/data-space-lab/dil-connector-dataplane
    tag: dcp-http-pull-edr-20261007-1
    pullPolicy: Always
  replicas: 1
  port: 8284
  grafanaAuditDb: /data/grafana-query-events.sqlite3
  # Material's vcluster currently has a stale Longhorn mount on dil-node5.
  # Leave empty in other clusters to let Kubernetes schedule normally.
  nodeName: dil-node4.collab-cloud.eu
  rcloneEnabled: true
  # Optional Secret containing an rclone.conf key.
  rcloneConfigSecret: ""
  # Generated by the GUI from the adapter-level rclone configuration.
  rcloneConfigPath: /data/rclone.conf
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 128Mi
    limits:
      cpu: "6"
      memory: 6Gi
      ephemeral-storage: 1Gi
  opcuaEnabled: false
  mqttEnabled: true
  # MQTT uses native TCP listeners. Public URLs and listener settings are
  # deployment-owned and are injected into the dataplane; they are not GUI
  # settings. Set public URLs to externally reachable TCP endpoints.
  mqttPublicProviderUrl: ""
  mqttPublicConsumerUrl: ""
  mqttProviderListenHost: "0.0.0.0"
  mqttConsumerListenHost: "0.0.0.0"
  mqttProviderListenPort: 1885
  mqttConsumerListenPort: 1883
  configStorage:
    enabled: true
    path: /data/dataplane-config.json
    size: 1Gi
    storageClassName: ""

service:
  port: 8282
